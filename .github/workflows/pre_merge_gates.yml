name: pre-merge-gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # typing guard diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_project.py .
      - run: python3 tools/verify_visual_assets.py
      # GDScript explicit-typing guard (docs/GDSCRIPT_TYPING.md). Scoped to .gd
      # files changed vs main so legacy probes aren't retroactively flagged.
      - run: python3 tools/check_gdscript_typing.py --changed --base=origin/main .
      - name: GDScript strict-typing gate (Issue #32)
        run: python3 tools/check_gdscript_strict.py --gate .
  headless-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          sudo unzip -q /tmp/godot.zip -d /opt
      - run: bash tools/regression_smoke.sh
        env:
          GODOT_BIN: /opt/Godot_v4.7-stable_linux.x86_64
      - run: xvfb-run -a /opt/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tools/tests/run_tests.gd
  visual-capture:
    name: visual-capture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine + xvfb + Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip
          python3 -m pip install --quiet Pillow
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          sudo unzip -q /tmp/godot.zip -d /opt
          test -x /opt/Godot_v4.7-stable_linux.x86_64
      - name: GDScript typing guard
        run: python3 tools/check_gdscript_typing.py --changed --base=origin/main .
      - name: Render + validate captures (CI=1, no vault push)
        # --headless has no GL context; the script renders under Xvfb with
        # gl_compatibility/llvmpipe. Captures are a DIFFERENT renderer than the
        # shipped Vulkan mobile renderer and are NOT device visual sign-off.
        env:
          CAP_REPO: ${{ github.workspace }}
          CAP_GODOT: /opt/Godot_v4.7-stable_linux.x86_64
        run: CI=1 bash tools/capture/render_and_push.sh
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures-${{ github.sha }}
          path: build/capture/
          if-no-files-found: error
