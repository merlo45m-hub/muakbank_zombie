name: pre-merge-gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # typing guard diffs against origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_project.py .
      - run: python3 tools/verify_visual_assets.py
      - run: python3 tools/verify_scene_resolves.py
      # GDScript explicit-typing guard (docs/GDSCRIPT_TYPING.md). Scoped to .gd
      # files changed vs main so legacy probes aren't retroactively flagged.
      - run: python3 tools/check_gdscript_typing.py --changed --base=origin/main .
      - name: GDScript strict-typing gate (Issue #32)
        run: python3 tools/check_gdscript_strict.py --gate .
      - run: python3 tools/check_probe_contracts.py --project-dir .
  headless-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          sudo unzip -q /tmp/godot.zip -d /opt
      - run: bash tools/regression_smoke.sh
        env:
          GODOT_BIN: /opt/Godot_v4.7-stable_linux.x86_64
      - run: xvfb-run -a /opt/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tools/tests/run_tests.gd
  visual-capture:
    name: visual-capture-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine + xvfb + Pillow
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb unzip
          python3 -m pip install --quiet Pillow
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          sudo unzip -q /tmp/godot.zip -d /opt
          test -x /opt/Godot_v4.7-stable_linux.x86_64
      - name: GDScript typing guard
        run: python3 tools/check_gdscript_typing.py --changed --base=origin/main .
      - name: Render + validate captures (CI=1, no vault push)
        # --headless has no GL context; the script renders under Xvfb with
        # gl_compatibility/llvmpipe. Captures are a DIFFERENT renderer than the
        # shipped Vulkan mobile renderer and are NOT device visual sign-off.
        env:
          CAP_REPO: ${{ github.workspace }}
          CAP_GODOT: /opt/Godot_v4.7-stable_linux.x86_64
        run: CI=1 bash tools/capture/render_and_push.sh
      - name: Title layout geometry gate (issue #63 I2)
        # Engine-side runtime rects -> explicit safe-area / overlap / stack
        # verdicts. The checker is fail-closed and writes layout_report.json.
        env:
          CAP_GODOT: /opt/Godot_v4.7-stable_linux.x86_64
        run: |
          set -euo pipefail
          mkdir -p build/capture
          CAP_LAYOUT_OUT="$GITHUB_WORKSPACE/build/capture/title_layout.json" \
            xvfb-run -a -s "-screen 0 1600x900x24" "$CAP_GODOT" \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --rendering-driver opengl3 \
              --resolution 1600x900 \
              --fixed-fps 60 \
              --path . \
              --script tools/capture/title_layout_probe.gd \
              > /tmp/cap_title_layout.log 2>&1
          grep -E 'LAYOUT:|SCRIPT ERROR|Parse Error' /tmp/cap_title_layout.log | tail -8 || true
          test -s build/capture/title_layout.json
          python3 tools/capture/check_title_layout.py build/capture/title_layout.json
      - name: Title typography and touch-target gate (issue #63 I3)
        env:
          CAP_GODOT: /opt/Godot_v4.7-stable_linux.x86_64
        run: |
          set -euo pipefail
          CAP_TYPO_OUT="$GITHUB_WORKSPACE/build/capture/title_typography.json" \
            xvfb-run -a -s "-screen 0 1600x900x24" "$CAP_GODOT" \
              --display-driver x11 \
              --rendering-method gl_compatibility \
              --rendering-driver opengl3 \
              --resolution 1600x900 \
              --fixed-fps 60 \
              --path . \
              --script tools/capture/title_typography_probe.gd \
              > /tmp/cap_title_typography.log 2>&1
          grep -E 'TYPO:|SCRIPT ERROR|Parse Error' /tmp/cap_title_typography.log | tail -8 || true
          test -s build/capture/title_typography.json
          python3 tools/capture/check_title_typography.py build/capture/title_typography.json
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures-${{ github.sha }}
          path: build/capture/
          if-no-files-found: error
